services:
  tor:
    build: ./tor
    container_name: tor
    mem_limit: 100m
    mem_reservation: 50m
    cpus: '0.3'
    volumes:
      - ./tor/torrc:/etc/tor/torrc:ro
    networks:
      tornet:
        ipv4_address: 172.21.0.20
    healthcheck:
        test: ["CMD-SHELL", "curl --socks5-hostname localhost:9050 https://check.torproject.org/api/ip | grep -q '\"IsTor\":true'"]
        interval: 40s
        timeout: 10s
        retries: 3
        start_period: 40s

  worker:
    depends_on:
        tor:
            condition: service_healthy
    build: ./worker
    container_name: torw
    mem_limit: 200m
    mem_reservation: 50m
    cpus: '0.3'
    dns:
      - 172.21.0.20
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      - PROXY=socks5://tor:9050
    networks:
      tornet:
        ipv4_address: 172.21.0.21

networks:
  tornet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
